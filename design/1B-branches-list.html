<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1B — Выбор филиала (список)</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--card-strong);
    border-radius: 12px; padding: 10px 14px; width: 280px; color: var(--text-3); font-size: 15px; box-shadow: var(--shadow-sm); }

  .seg { display: inline-flex; background: var(--card-strong); border-radius: 10px; padding: 3px; margin-bottom: 20px; }
  .seg button { padding: 7px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--text-2); }
  .seg button.on { background: #fff; color: var(--text); box-shadow: var(--shadow-sm); }

  .list { display: flex; flex-direction: column; gap: 14px; }
  .row { display: grid; grid-template-columns: 132px 1.4fr 1fr 1fr 1fr auto 20px; align-items: center; gap: 24px;
    padding: 14px 20px 14px 14px; transition: transform .2s, box-shadow .2s; position: relative; overflow: hidden; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
  .row.g { --c: var(--green); } .row.o { --c: var(--orange); } .row.r { --c: var(--red); }
  .row:hover { transform: translateX(4px); box-shadow: var(--shadow-lg); }
  .row .photo { width: 132px; height: 88px; border-radius: 12px; margin-left: 6px; }
  .row .photo svg { width: 28px; height: 28px; }
  .row h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
  .row .meta { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .row .alert { margin-top: 8px; font-size: 13px; font-weight: 600; color: #D70015; display: flex; align-items: center; gap: 5px; }
  .metric .v { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .metric .v small { font-size: 13px; margin-left: 4px; }
  .bar { height: 6px; background: #fff; border-radius: 3px; margin-top: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--card-strong); }
  .bar i { display: block; height: 100%; border-radius: 3px; }

  @media (max-width: 1000px) {
    .row { grid-template-columns: 96px 1fr auto; gap: 14px; }
    .row .photo { width: 96px; height: 72px; }
    .row .metric, .row > svg { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="h1">Филиалы</div>
      <div class="sub">6 точек · сначала те, что требуют внимания</div>
    </div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Поиск филиала
    </div>
  </header>

  <div class="seg"><button class="on">Все</button><button>Школы</button><button>Магазин</button><button>Требуют внимания</button></div>

  <section class="list" id="list"></section>
</div>

<div class="variant-tag">Вариант 1B · Список с метриками <a href="index.html">все варианты</a></div>

<script src="assets/data.js"></script>
<script>
const order = { r: 0, o: 1, g: 2 };
document.getElementById('list').innerHTML = [...BRANCHES].sort((a, b) => order[a.status] - order[b.status]).map(b => {
  const c = b.plan >= 100 ? 'var(--green)' : b.plan >= 90 ? 'var(--orange)' : 'var(--red)';
  const m1 = b.type === 'school'
    ? `<div class="label">Ученики</div><div class="v">${b.students}<small>${fmtDelta(b.studentsDelta)}</small></div>`
    : `<div class="label">Чеки за месяц</div><div class="v">${b.checks}<small>${fmtDelta(b.checksDelta)}</small></div>`;
  const m3 = b.type === 'school'
    ? `<div class="label">Посещаемость</div><div class="v">${b.attendance}%</div>`
    : `<div class="label">Мало на складе</div><div class="v">${b.stock} поз.</div>`;
  return `
  <a class="row card ${b.status}" href="2A-dashboard-tiles.html">
    <div class="photo ${b.p}">${ICON_CAMERA}</div>
    <div>
      <h3><span class="dot ${b.status}"></span>${b.name}</h3>
      <div class="meta">${b.addr} · ${b.manager}</div>
      ${b.alert ? `<div class="alert">${ICON_ALERT}${b.alert}</div>` : ''}
    </div>
    <div class="metric">${m1}</div>
    <div class="metric"><div class="label">Выручка · план</div><div class="v">${b.revenue.toFixed(2).replace('.', ',')} млн<small>${fmtPlan(b.plan)}</small></div>
      <div class="bar"><i style="width:${Math.min(b.plan, 100)}%;background:${c}"></i></div></div>
    <div class="metric">${m3}</div>
    ${tasksIcon(b)}
    ${ICON_CHEVRON}
  </a>`;
}).join('');
</script>
</body>
</html>
